# CI MedFlow-IA V1 — validação apenas (sem deploy automático)
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

defaults:
  run:
    working-directory: MedFlow-IA

jobs:
  validate:
    name: Lint, env e build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder_anon_key_for_ci_build_only
      VITE_MEDFLOW_APP_URL: https://app.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: MedFlow-IA/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Env check (produção)
        run: npm run env-check:prod

      - name: Release artifacts check
        run: npm run release-check

      - name: Smoke structure check
        run: npm run smoke-check

      - name: Production build
        run: npm run build

  release-validation:
    name: Release validation (manual-friendly)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder_anon_key_for_ci_build_only
      VITE_MEDFLOW_APP_URL: https://app.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: MedFlow-IA/package-lock.json
      - run: npm ci
        working-directory: MedFlow-IA
      - name: Full production validate
        run: npm run production-validate
        working-directory: MedFlow-IA
